[command]
default=moo mkset --single-copy moose:/devfc/$ARCHIVE_SET_NAME || true

[file:$ROSE_DATA/etc/um_STASHmaster]
mode=symlink
source=${UMDIR}/vn${UM_VN}/ctldata/STASHmaster

[file:$ROSE_DATA/etc/um_spectral_lam]
mode=symlink
source=${UMDIR}/vn${UM_VN}/ctldata/spectral/ga3_1

#
# This is the full path to the directory containing the L90 aerosol ancillaries.
#
[file:$ROSE_DATA/etc/ancil_atmos]
mode=symlink
source=${UMDIR}/ancil/atmos

[file:$ROSE_SUITE_DIR/share/fcm_make_um_utils]
mode=symlink
source=${UMDIR}/vn${UM_VN}/ex1a/utilities

[file:$ROSE_SUITE_DIR/share/fcm_make_surf]
mode=symlink
source=/home/users/frsurf/cylc-run/surf-2022.12.2/share/fcm_make_surf_ex_milan_cce_opt

#
# global model directories below. Previously in their own file.
#
[file:$ROSE_DATA/etc/um_spectral_ga6]
mode=symlink
source=${UMDIR}/vn${UM_VN}/ctldata/spectral/ga3_0

[file:$ROSE_DATA/etc/um_spectral_ga7]
mode=symlink
source=${UMDIR}/vn${UM_VN}/ctldata/spectral/ga7

[file:$ROSE_DATA/etc/um_spectral_ga7_1]
mode=symlink
source=${UMDIR}/vn${UM_VN}/ctldata/spectral/ga7_1

[file:$ROSE_DATA/etc/spectral_files]
source=fcm:socrates.xm_tr/data/spectra/ga9@um13.7

[file:$ROSE_DATA/etc/ancil_versions_ga6p1]
mode=symlink
source=${UMDIR}/ancil/data/ancil_versions/${GLM_RESLN}e/GA6.0/latest/ancils

[file:$ROSE_DATA/etc/ancil_versions_ga6p1_gl8p1]
mode=symlink
source=${UMDIR}/ancil/data/ancil_versions/${GLM_RESLN}e/ps41/latest/ancils

[file:$ROSE_DATA/etc/ancil_versions_ga7p2_gl8p1]
mode=symlink
source=${UMDIR}/ancil/data/ancil_versions/${GLM_RESLN}e/ps43/latest/ancils

[file:$ROSE_DATA/etc/ancil_versions_ga8_gl9]
mode=symlink
source=${UMDIR}/ancil/data/ancil_versions/${GLM_RESLN}e_orca025/ps45/v1/ancils

[file:$ROSE_DATA/etc/ancil_versions_GAL9]
mode=symlink
source=${UMDIR}/ancil/data/ancil_versions/${GLM_RESLN}e_orca025/ps45/v1/ancils

[file:$ROSE_DATA/etc/ancil_versions_CoMorphA]
mode=symlink
source=$UMDIR/ancil/data/ancil_versions/${GLM_RESLN}e_orca025/ps45/v1/ancils

[file:$ROSE_DATA/etc/ancil_versions_CoMorphA9]
mode=symlink
source=$UMDIR/ancil/data/ancil_versions/${GLM_RESLN}e_orca025/ps45/v1/ancils

[file:$ROSE_SUITE_DIR/etc/ancil_versions/xukv_ral3/ancil_versions]
mode=symlink
source=/data/users/rmed_workflows/KGOs/inputs/ancils/xukv_ral3/ancil_versions

[file:$ROSE_SUITE_DIR/etc/ancil_versions/xukv_l90/ancil_versions]
mode=symlink
source=/data/users/rmed_workflows/KGOs/inputs/ancils/xukv_l90/ancil_versions

#
# This is the full path to the directory containing the netcdf ukca ancillary data for
# offline oxidants and emmissions. The standard setup uses CMIP5 emissions.
#
[file:$ROSE_DATA/etc/ancil_ukca_glm1]
mode=symlink
source=/data/users/rmed_workflows/umdir/hamgo_ancils/ukca-v10p3/n216e_mon_gcal/ncdf_ukca

[file:$ROSE_DATA/etc/ancil_ukca_glm2]
mode=symlink
source=${UMDIR}/ancil/atmos/${GLM_RESLN}e/

#
# This is the directory containing the ukca glomap aerosol climatologies 
#
[file:$ROSE_DATA/etc/ancil_glomap_aeroclim]
mode=symlink
source=$UMDIR/ancil/atmos/GC5/${GLM_RESLN}e/aerosol_clims/glomap/gregorian/v1/qrclim.aerosols70.nc

#
# SIMIM centralized data for executable and coefficients
#
[file:$ROSE_DATA/etc/simim_bin]
mode=symlink
source=/data/users/rmed_workflows/umdir/simim/bin/

[file:$ROSE_DATA/etc/simim_coefs]
mode=symlink
source=/data/users/rmed_workflows/umdir/simim_coefs
