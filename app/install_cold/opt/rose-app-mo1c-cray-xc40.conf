[file:$ROSE_DATA/etc/ancil_versions_ga6p1]
mode=symlink
source=/projects/um1/ancil/data/ancil_versions/${GLM_RESLN}e/GA6.0/latest/ancils

[file:$ROSE_DATA/etc/ancil_versions_ga6p1_gl8p1]
