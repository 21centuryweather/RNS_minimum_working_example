source=~frsurf/cylc-run/SURF31.2.0/share/fcm_make_surf_xc40_haswell_ifort_opt

#
# global model directories below. Previously in their own file.
#
[file:$ROSE_DATA/etc/um_spectral_ga6]
mode=symlink
source=/projects/um1/vn${UM_VN}/ctldata/spectral/ga3_0

[file:$ROSE_DATA/etc/um_spectral_ga7]
