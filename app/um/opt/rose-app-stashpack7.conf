# This file contains the stash that is currently recommended for
# comparing with lfric output. This includes all the diagnostics
# from stash pack 1 with (a) some minor modifications to
# the choice of boundary layer height diagnostic, and (b)
# a change to hour-by-hour accumulations, as opposed to
# cumulative accumulations.

# Additional stash is also included for um vs lfric comparisons
# on model levels.  See:
# https://code.metoffice.gov.uk/trac/rmed/ticket/621

