[!!file:OASIS_JNR_SEND]
source=namelist:oasis_send_nml

[file:RECONA]
source=namelist:recon_technical namelist:recon_science namelist:recon_vertical namelist:horizont namelist:headers (namelist:trans(:)) (namelist:recon_idealised) (namelist:ideal_free_tracer(:))

[file:SHARED]
