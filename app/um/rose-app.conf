meta=um-atmos/vn13.5

[command]
default=um-atmos
recon=um-recon

[env]
ATMOS_EXEC=um-atmos.exe
ATMOS_KEEP_MPP_STDOUT=true
ATMOS_STDOUT_FILE=pe_output/umnsa.fort6.pe
COUPLER=none
DATAM=$ROSE_DATAC/${ROSE_TASK_PREFIX}_um
DATAW=$ROSE_DATAC/${ROSE_TASK_PREFIX}_um
DR_HOOK=false
!!DR_HOOK_CATCH_SIGNALS=0
!!DR_HOOK_IGNORE_SIGNALS=0
!!DR_HOOK_OPT=wallprof,self
!!DR_HOOK_PROFILE=$CYLC_TASK_WORK_DIR/drhook.prof.%d
!!DR_HOOK_PROFILE_LIMIT=-10.0
!!DR_HOOK_PROFILE_PROC=-1
ENS_MEMBER=0
FASTRUN=false
HISTORY=$ROSE_DATAC/${ROSE_TASK_PREFIX}_um/dkvjr.xhist
!!HYBRID_COMPONENT=none
MPICH_GNI_MAX_EAGER_MSG_SIZE=65536
MPICH_GNI_MAX_VSHORT_MSG_SIZE=8192
OMP_STACKSIZE=2G
PRINT_STATUS=PrStatus_Normal
RCF_PRINTSTATUS=PrStatus_Normal
RCF_TIMER=false
RECONTMP=atmos.recontmp
RECON_EXEC=um-recon.exe
RECON_KEEP_MPP_STDOUT=true
RECON_STDOUT_FILE=pe_output/umnsa.fort6.pe
RUNID=umnsa
SPECTRAL_FILE_DIR=$ROSE_DATA/etc/um_spectral_ga7
UM_THREAD_LEVEL=MULTIPLE
VN=13.5

[file:$DATAM]
mode=mkdir
source=

[file:$DATAW]
mode=mkdir
source=

[file:ATMOSCNTL]
source=namelist:configid namelist:nlstcgen namelist:nlst_mpp namelist:run_track namelist:run_calc_pmsl namelist:lbc_options namelist:run_nudging namelist:run_sl namelist:run_diffusion namelist:run_cosp namelist:radfcdia namelist:r2swclnl namelist:r2lwclnl namelist:clmchfcg namelist:acp namelist:acdiag namelist:jules_nvegparm namelist:jules_pftparm (namelist:jules_triffid) namelist:jules_elevate (namelist:jules_deposition_species(:)) (namelist:jules_deposition_species_specific) namelist:iau_nl namelist:tuning_segments (namelist:nlstcall_pp(:)) (namelist:nlstcall_nc(:)) namelist:nlstcall_nc_options

[!!file:HYBRID_JNR2SNR]
source=namelist:hybrid_cpl namelist:hybrid_jnr

[!!file:HYBRID_SNR2JNR]
source=namelist:hybrid_cpl namelist:hybrid_snr

[file:IDEALISE]
source=(namelist:idealised)

[file:IOSCNTL]
source=namelist:ioscntl namelist:io_control namelist:prnt_control (namelist:lustre_control) (namelist:lustre_control_custom_files)

[!!file:OASIS_ATM_SEND]
